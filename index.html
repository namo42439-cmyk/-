<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سريع | لتوصيل الطلبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #ea580c;
      --primary-dark: #c2410c;
      --primary-light: #fff7ed;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* شاشة تسجيل الدخول */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #fff7ed 0%, #f8fafc 60%, #ffedd5 100%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.09);
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 800;
    }

    .auth-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }

    .form-control:focus {
      outline: 2px solid rgba(234, 88, 12, 0.25);
      border-color: var(--primary);
    }

    .gps-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-gps {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #fed7aa;
      border-radius: 11px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-gps:hover {
      background: #ffedd5;
    }

    .gps-status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    /* التطبيق الرئيسي */
    .app-shell {
      display: none;
    }

    .app-shell.active {
      display: block;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
    }

    .location-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 11px;
      font-size: 13px;
    }

    .location-box select {
      border: none;
      background: transparent;
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .search-box {
      flex: 1 1 240px;
      max-width: 360px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 11px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 13.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-chip {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      background: var(--primary-light);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 9px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 60px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
    }

    .rating {
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .meta {
      font-size: 12.5px;
      color: var(--muted);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .price {
      font-weight: 800;
      color: var(--primary-dark);
      font-size: 15px;
    }

    .add-btn {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    /* السلة المنزلقة */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      justify-content: flex-start;
      z-index: 50;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-weight: 700;
      cursor: pointer;
    }

    /* متابعة حالة الطلب */
    .tracker-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: none;
    }

    .tracker-box.active {
      display: block;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .step {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .step.done {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-badge">س</div>
        <span style="font-size: 20px; font-weight: 800;">سريع | لتوصيل الطلبات</span>
      </div>
      <h1 class="auth-title">تسجيل دخول</h1>
      <p class="auth-subtitle">أدخل بياناتك وحدد موقعك للبدء بالطلب فوراً</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="userName">الاسم الكامل</label>
          <input id="userName" class="form-control" type="text" placeholder="مثال: أحمد الخالد" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="userPhone">رقم الهاتف</label>
          <input id="userPhone" class="form-control" type="tel" placeholder="09xxxxxxxx" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginArea">الموقع الافتراضي</label>
          <div class="gps-row">
            <select id="loginArea" class="form-control">
              <option value="أبو رمانة - دمشق" selected>أبو رمانة - دمشق</option>
              <option value="المزة - دمشق">المزة - دمشق</option>
              <option value="الشعلان - دمشق">الشعلان - دمشق</option>
              <option value="باب توما - دمشق">باب توما - دمشق</option>
              <option value="جرمانا - ريف دمشق">جرمانا - ريف دمشق</option>
            </select>
            <button type="button" class="btn-gps" id="authGpsBtn">📍 GPS</button>
          </div>
          <div id="authGpsStatus" class="gps-status">الموقع الافتراضي: أبو رمانة - دمشق</div>
        </div>

        <button type="submit" class="btn-primary">دخول</button>
      </form>
    </div>
  </section>

  <!-- التطبيق الرئيسي -->
  <div id="appShell" class="app-shell">
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-badge">س</div>
          <span>سريع | لتوصيل الطلبات</span>
        </div>

        <div class="location-box">
          <span>📍</span>
          <select id="headerArea">
            <option value="أبو رمانة - دمشق" selected>أبو رمانة - دمشق</option>
            <option value="المزة - دمشق">المزة - دمشق</option>
            <option value="الشعلان - دمشق">الشعلان - دمشق</option>
            <option value="باب توما - دمشق">باب توما - دمشق</option>
            <option value="جرمانا - ريف دمشق">جرمانا - ريف دمشق</option>
          </select>
          <button type="button" class="btn-gps" id="headerGpsBtn" style="padding: 4px 8px; font-size: 11.5px;">GPS</button>
        </div>

        <div class="search-box">
          <input id="searchInput" type="search" placeholder="ابحث عن مطعم، بقالة، صيدلية أو صنف..." />
        </div>

        <div class="header-actions">
          <span id="userChip" class="user-chip">مرحباً</span>
          <button id="logoutBtn" class="btn-logout" type="button">خروج</button>
          <button id="openCartBtn" class="cart-btn" type="button">
            <span>السلة</span>
            <span id="cartCount">0</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <div id="categoriesBar" class="categories"></div>

      <h2 class="section-title">المتاجر والأصناف المتاحة</h2>
      <div id="itemsGrid" class="grid"></div>

      <section id="trackerBox" class="tracker-box">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <h3 style="font-size:17px; font-weight:800;">متابعة حالة الطلب #<span id="orderNumber"></span></h3>
            <p id="orderSummaryText" class="meta"></p>
          </div>
          <button id="newOrderBtn" class="add-btn" type="button">طلب جديد</button>
        </div>
        <div id="stepsList" class="steps"></div>
      </section>
    </main>

    <!-- سلة التسوق -->
    <div id="cartBackdrop" class="drawer-backdrop">
      <aside class="drawer">
        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="font-size:17px; font-weight:800;">سلة الطلبات</h3>
            <button id="closeCartBtn" class="btn-logout" type="button">إغلاق ✕</button>
          </div>

          <div id="cartItems"></div>

          <div class="form-group" style="margin-top:14px;">
            <label class="form-label" for="deliveryAddress">تفاصيل العنوان / ملاحظات</label>
            <input id="deliveryAddress" class="form-control" type="text" placeholder="اسم الشارع، البناء، الطابق..." />
          </div>
        </div>

        <div style="border-top:1px solid var(--border); padding-top:14px;">
          <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;">
            <span>المجموع الفرعي</span>
            <span id="subtotalText">0 ل.س</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:10px;">
            <span>رسوم التوصيل</span>
            <span id="deliveryFeeText">15,000 ل.س</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:800; margin-bottom:14px;">
            <span>الإجمالي</span>
            <span id="totalText">0 ل.س</span>
          </div>
          <button id="checkoutBtn" class="btn-primary" type="button">إرسال الطلب</button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const CATEGORIES = ['الكل', 'مطاعم', 'بقالة وماركت', 'صيدلية', 'طرود ومشتريات'];

    const ITEMS = [
      { id: 1, name: 'وجبة شاورما عربي دبل', store: 'مطعم الشام الذهبي', category: 'مطاعم', price: 65000, rating: '4.8', eta: '25-35 د' },
      { id: 2, name: 'بيتزا مارغريتا وسط', store: 'فرن أبو رمانة', category: 'مطاعم', price: 85000, rating: '4.6', eta: '30-40 د' },
      { id: 3, name: 'سلة خضار وفواكه طازجة', store: 'ماركت النور', category: 'بقالة وماركت', price: 55000, rating: '4.7', eta: '20-30 د' },
      { id: 4, name: 'حليب وألبان ومنتجات فطور', store: 'سوبرماركت الياسمين', category: 'بقالة وماركت', price: 48000, rating: '4.5', eta: '20-30 د' },
      { id: 5, name: 'مستلزمات عناية وأدوية عامة', store: 'صيدلية الحياة', category: 'صيدلية', price: 40000, rating: '4.9', eta: '15-25 د' },
      { id: 6, name: 'توصيل طرد سريع داخل المدينة', store: 'خدمة سريع للطرود', category: 'طرود ومشتريات', price: 25000, rating: '4.7', eta: '20-40 د' }
    ];

    const DELIVERY_FEE = 15000;
    let selectedCategory = 'الكل';
    let cart = [];
    let currentUser = null;
    let gpsCoords = null;

    const authScreen = document.getElementById('authScreen');
    const appShell = document.getElementById('appShell');
    const loginForm = document.getElementById('loginForm');
    const loginArea = document.getElementById('loginArea');
    const headerArea = document.getElementById('headerArea');
    const authGpsBtn = document.getElementById('authGpsBtn');
    const headerGpsBtn = document.getElementById('headerGpsBtn');
    const authGpsStatus = document.getElementById('authGpsStatus');
    const searchInput = document.getElementById('searchInput');
    const categoriesBar = document.getElementById('categoriesBar');
    const itemsGrid = document.getElementById('itemsGrid');
    const cartBackdrop = document.getElementById('cartBackdrop');

    function formatPrice(val) {
      return val.toLocaleString('ar-SY') + ' ل.س';
    }

    function detectGPS(targetSelect, statusEl) {
      if (!navigator.geolocation) {
        if (statusEl) statusEl.textContent = 'المتصفح لا يدعم تحديد الموقع عبر GPS.';
        return;
      }
      if (statusEl) statusEl.textContent = 'جاري تحديد موقعك عبر GPS...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          gpsCoords = { lat: latitude.toFixed(5), lng: longitude.toFixed(5) };
          if (targetSelect) {
            const gpsOptionValue = `GPS (${gpsCoords.lat}, ${gpsCoords.lng})`;
            let opt = Array.from(targetSelect.options).find(o => o.value === gpsOptionValue);
            if (!opt) {
              opt = new Option(gpsOptionValue, gpsOptionValue, true, true);
              targetSelect.add(opt, 0);
            }
            targetSelect.value = gpsOptionValue;
          }
          if (statusEl) {
            statusEl.textContent = `تم تحديد الموقع عبر GPS: ${gpsCoords.lat}, ${gpsCoords.lng}`;
          }
        },
        () => {
          if (statusEl) {
            statusEl.textContent = 'تعذر الوصول إلى GPS، يمكنك اختيار الحي يدوياً.';
          }
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    authGpsBtn.addEventListener('click', () => detectGPS(loginArea, authGpsStatus));
    headerGpsBtn.addEventListener('click', () => {
      detectGPS(headerArea, null);
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const phone = document.getElementById('userPhone').value.trim();
      const area = loginArea.value;

      currentUser = { name, phone, area };
      headerArea.value = area;
      document.getElementById('userChip').textContent = `مرحباً، ${name}`;
      authScreen.style.display = 'none';
      appShell.classList.add('active');
      renderCategories();
      renderItems();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      appShell.classList.remove('active');
      authScreen.style.display = 'flex';
    });

    function renderCategories() {
      categoriesBar.innerHTML = CATEGORIES.map(cat => `
        <button type="button" class="cat-btn ${cat === selectedCategory ? 'active' : ''}" data-cat="${cat}">
          ${cat}
        </button>
      `).join('');

      categoriesBar.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedCategory = btn.dataset.cat;
          renderCategories();
          renderItems();
        });
      });
    }

    function renderItems() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = ITEMS.filter(item => {
        const matchCat = selectedCategory === 'الكل' || item.category === selectedCategory;
        const matchSearch = !q || item.name.toLowerCase().includes(q) || item.store.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      itemsGrid.innerHTML = filtered.map(item => `
        <article class="card">
          <div>
            <div class="card-top">
              <h3 class="card-title">${item.name}</h3>
              <span class="rating">★ ${item.rating}</span>
            </div>
            <p class="meta">${item.store} • ${item.category}</p>
            <p class="meta">التوصيل خلال: ${item.eta}</p>
          </div>
          <div class="card-footer">
            <span class="price">${formatPrice(item.price)}</span>
            <button type="button" class="add-btn" onclick="addToCart(${item.id})">أضف إلى السلة</button>
          </div>
        </article>
      `).join('') || '<p class="meta">لا توجد نتائج مطابقة للبحث.</p>';
    }

    window.addToCart = function(id) {
      const item = ITEMS.find(i => i.id === id);
      if (!item) return;
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    };

    window.changeQty = function(id, delta) {
      const target = cart.find(c => c.id === id);
      if (!target) return;
      target.qty += delta;
      if (target.qty <= 0) {
        cart = cart.filter(c => c.id !== id);
      }
      updateCartUI();
    };

    function updateCartUI() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const total = subtotal > 0 ? subtotal + DELIVERY_FEE : 0;

      document.getElementById('cartCount').textContent = totalQty;
      document.getElementById('subtotalText').textContent = formatPrice(subtotal);
      document.getElementById('deliveryFeeText').textContent = formatPrice(subtotal > 0 ? DELIVERY_FEE : 0);
      document.getElementById('totalText').textContent = formatPrice(total);

      const cartItemsEl = document.getElementById('cartItems');
      if (!cart.length) {
        cartItemsEl.innerHTML = '<p class="meta">السلة فارغة حالياً.</p>';
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div style="font-weight:700; font-size:13.5px;">${item.name}</div>
            <div class="meta">${formatPrice(item.price)}</div>
          </div>
          <div class="qty-controls">
            <button type="button" class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button type="button" class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', renderItems);
    document.getElementById('openCartBtn').addEventListener('click', () => {
      updateCartUI();
      cartBackdrop.classList.add('open');
    });
    document.getElementById('closeCartBtn').addEventListener('click', () => {
      cartBackdrop.classList.remove('open');
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if (!cart.length) {
        alert('أضف عناصر إلى السلة أولاً.');
        return;
      }
      const addr = document.getElementById('deliveryAddress').value.trim() || headerArea.value;
      const orderId = Math.floor(100000 + Math.random() * 900000);
      const stages = ['تم استلام الطلب', 'قيد التحضير', 'في الطريق مع المندوب', 'تم التوصيل'];

      document.getElementById('orderNumber').textContent = orderId;
      document.getElementById('orderSummaryText').textContent =
        `المستلم: ${currentUser ? currentUser.name : 'ضيف'} | الموقع: ${addr}`;

      document.getElementById('stepsList').innerHTML = stages.map((st, idx) => `
        <div class="step ${idx === 0 ? 'done' : ''}">${st}</div>
      `).join('');

      document.getElementById('trackerBox').classList.add('active');
      cart = [];
      updateCartUI();
      cartBackdrop.classList.remove('open');
    });

    document.getElementById('newOrderBtn').addEventListener('click', () => {
      document.getElementById('trackerBox').classList.remove('active');
    });
  </script>
</body>
</html>
